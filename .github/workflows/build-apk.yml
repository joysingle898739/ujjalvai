name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/UzzalBhaiShop-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: release-apk/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: apk-latest
          name: "📱 Uzzal Bhai Shop - Latest Debug APK (v${{ github.run_number }})"
          body: |
            ### 📱 উজ্জ্বল ভাইয়ের দোকান - অ্যান্ড্রয়েড অ্যাপ (Debug APK)
            - **বিল্ড নম্বর:** #${{ github.run_number }}
            - **কমিট:** ${{ github.sha }}
            - **সরাসরি ডাউনলোড:** নিচে থাকা `app-debug.apk` বা `UzzalBhaiShop-debug.apk` ফাইলটিতে ক্লিক করে সরাসরি ফোনে ডাউনলোড ও ইনস্টল করুন।
          draft: false
          prerelease: false
          files: |
            release-apk/app-debug.apk
            release-apk/UzzalBhaiShop-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
